name: Leve2 Android APK

on:
  push:
    branches: ["leve2-low-end", "master", "main"]
    tags: ["v*", "leve2-v*"]
  workflow_dispatch:

permissions:
  contents: write

defaults:
  run:
    working-directory: platforms/android

jobs:
  build-apk:
    name: Build Leve2 APK (ARM64)
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout source and submodules
        uses: actions/checkout@v7
        with:
          submodules: recursive

      - name: Set up Java 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: platform-tools

      - name: Install Android build dependencies
        run: |
          yes | sdkmanager \
            "platforms;android-36" \
            "build-tools;35.0.0" \
            "ndk;29.0.14206865" \
            "cmake;3.31.6" >/dev/null

      - name: Fetch shader compiler dependencies
        run: python3 app/src/main/cpp/3rdparty/shaderc/utils/git-sync-deps

      - name: Install Rust Android target
        run: rustup target add aarch64-linux-android

      - name: Build GitHub-flavor APK
        env:
          VERSION_CODE: ${{ github.run_number }}
          VERSION_NAME: 0.1.0-${{ github.ref_name }}
        run: |
          ./gradlew :app:assembleGithubRelease \
            --stacktrace \
            -Parmsx2.versionCode="$VERSION_CODE" \
            -Parmsx2.versionName="$VERSION_NAME" \
            -Parmsx2.compileSdk=36 \
            -Parmsx2.applicationId=com.leve2.emulator \
            -Parmsx2.appLabel=@string/app_name_leve2

      - name: Rename APK
        run: |
          mkdir -p ../../dist
          cp app/build/outputs/apk/github/release/app-github-release.apk \
            ../../dist/Leve2-${{ github.ref_name }}-arm64.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v7
        with:
          name: Leve2-${{ github.ref_name }}-arm64
          path: dist/Leve2-${{ github.ref_name }}-arm64.apk
          if-no-files-found: error
          retention-days: 30

      - name: Publish tagged release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ github.ref_name }}
          name: Leve2 ${{ github.ref_name }}
          prerelease: true
          generate_release_notes: true
          files: dist/Leve2-${{ github.ref_name }}-arm64.apk
